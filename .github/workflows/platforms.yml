name: Платформы

# Тяжёлые проверки на настоящих платформах: Windows, Linux с системным
# хранилищем (gnome-keyring), Android-эмулятор. Обычный CI (ci.yml) идёт на
# каждый push только на Ubuntu.
#
# Сборки для ручной проверки выгружаются артефактами прогона (страница прогона
# → Artifacts): APK (debug), Linux bundle (tar.gz, release), Windows (zip,
# release — отладочной сборке MSVC нужны отладочные библиотеки Visual Studio,
# на обычном компьютере она не запустится). Хранилище — системное (YL_VAULT по
# умолчанию). Сборки выгружаются до интеграционных тестов, поэтому есть и при
# их падении.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - name: Версия Flutter
        id: flutter
        shell: bash
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - run: flutter pub get
      - name: Сборка (release) для ручной проверки
        shell: pwsh
        run: |
          flutter build windows --release
          $bundle = "build/windows/x64/runner/Release"
          # Библиотеки VC++ — чтобы сборка запускалась без отдельной установки.
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR/System32/$dll" $bundle
          }
          Compress-Archive -Path "$bundle/*" -DestinationPath yeenlink-windows-x64.zip
      - name: Выгрузка сборки Windows
        uses: actions/upload-artifact@v4
        with:
          name: yeenlink-windows-x64
          path: client/yeenlink-windows-x64.zip
          retention-days: 14
          if-no-files-found: error
      - name: Модульные тесты (golden на Windows пропускаются)
        run: flutter test
      - name: Интеграционный тест (Диспетчер учётных данных, подписи)
        run: flutter test integration_test -d windows

  linux:
    name: Linux (libsecret)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - name: Пакеты для сборки и системного хранилища
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev xvfb gnome-keyring dbus-x11
      - name: Версия Flutter
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - run: flutter pub get
      - name: Сборка (release) для ручной проверки
        run: |
          flutter build linux --release
          tar -czf yeenlink-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - name: Выгрузка сборки Linux
        uses: actions/upload-artifact@v4
        with:
          name: yeenlink-linux-x64
          path: client/yeenlink-linux-x64.tar.gz
          retention-days: 14
          if-no-files-found: error
      - name: Интеграционный тест (libsecret через gnome-keyring)
        run: |
          dbus-run-session -- bash -c '
            echo -n "ci" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            xvfb-run -a flutter test integration_test -d linux
          '

  android:
    name: Android (эмулятор)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Место на диске для эмулятора
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules && df -h /
      - name: KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Версия Flutter
        id: flutter
        run: echo "version=$(cat client/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - run: flutter pub get
        working-directory: client
      - name: Сборка APK (debug) для ручной проверки
        working-directory: client
        run: flutter build apk --debug
      - name: Выгрузка APK
        uses: actions/upload-artifact@v4
        with:
          name: yeenlink-android-debug
          path: client/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Интеграционный тест на эмуляторе (Keystore, подписи, замер KDF)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 2048M
          working-directory: client
          script: flutter test integration_test -d emulator-5554
