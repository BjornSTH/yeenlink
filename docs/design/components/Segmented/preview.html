<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"><style>body{margin:0;background:var(--bg-100);color:var(--ink);font-family:var(--font-sans)} .row{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap;padding:var(--space-4)} button{font-family:inherit;cursor:pointer} .sg{display:flex;padding:3px;gap:3px;border-radius:var(--radius-md);background:var(--bg-000);width:360px} .sg button{flex:1;height:34px;border:none;border-radius:var(--radius-sm);background:transparent;color:var(--subtle);font-size:13px;font-weight:600} .sg button[aria-pressed="true"]{background:var(--bg-400);color:var(--ink)} .sg button.off{color:var(--status-offline)}</style></head>
<body>
<div class="row"><div class="sg"><button aria-pressed="false">480p</button><button aria-pressed="true">720p</button><button class="off" aria-pressed="false">1080p · нет</button></div></div>
<script>document.querySelectorAll(".sg button:not(.off)").forEach(b=>b.onclick=()=>{b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true")})</script>
</body></html>
