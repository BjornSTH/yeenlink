<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"><style>body{margin:0;background:var(--bg-100);color:var(--ink);font-family:var(--font-sans)} .row{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap;padding:var(--space-4)} button{font-family:inherit;cursor:pointer} .a{position:relative;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--on-accent)} .dot{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:var(--radius-full);border:3px solid var(--bg-100)} .ring{box-shadow:0 0 0 3px var(--bg-100),0 0 0 6px var(--accent)}</style></head>
<body>
<div class="row"><div class="a" style="width:40px;height:40px;background:#8A6E4B;font-size:13px">КР<span class="dot" style="background:var(--status-online)"></span></div><div class="a" style="width:40px;height:40px;background:#6E7A63;font-size:13px">СА<span class="dot" style="background:var(--status-idle)"></span></div><div class="a" style="width:40px;height:40px;background:#9A8566;font-size:13px">ХО<span class="dot" style="background:var(--status-dnd)"></span></div><div class="a ring" style="width:56px;height:56px;background:#7D6A7A;font-size:18px">ПЯ</div><div class="a" style="width:44px;height:44px;border-radius:var(--radius-lg);background:var(--hyena-banner);color:var(--ink);font-size:14px">НП</div></div>
<script></script>
</body></html>
