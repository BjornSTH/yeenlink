<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>YeenLink — новый пост, ПК</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; color: #ECE6DD; font-family: 'Manrope', system-ui, sans-serif">
<dc-import name="Main" accent="{{accent}}" hint-size="1440px,900px"></dc-import>
<div style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(15,14,13,0.7); display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-label="Новый пост" style="width: 600px; border-radius: 18px; background: #1C1B19; border: 1px solid #2D2A26; box-shadow: 0 30px 80px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden">
<div style="height: 64px; padding: 0 16px 0 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2D2A26"><h2 style="margin: 0; font-size: 19px; font-weight: 800">Новый пост на стене</h2><a href="Main.dc.html" aria-label="Закрыть" style="width: 36px; height: 36px; border-radius: 18px; border: 1px solid #3A3631; color: #A39A8D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a></div>
<div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; gap: 12px"><div style="width: 42px; height: 42px; flex-shrink: 0; border-radius: 21px; background: #7D6A7A; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: #1C1B19">ПЯ</div><textarea aria-label="Текст поста" rows="4" placeholder="Что нового? Пост увидят на выбранных серверах" style="flex-grow: 1; padding: 8px 0; border: none; background: transparent; color: #ECE6DD; font-family: inherit; font-size: 16px; line-height: 1.5; outline: none; resize: none">Дорисовал карту побережья для новой кампании. Финальная версия будет в пятницу.</textarea></div>
<div style="position: relative; margin-left: 54px"><div style="height: 180px; border-radius: 12px; position: relative; overflow: hidden; background: #2B3330"><div style="position: absolute; left: 10%; top: 20%; width: 34%; height: 40%; border-radius: 50%; background: #3B4A3F"></div><div style="position: absolute; left: 42%; top: 44%; width: 26%; height: 32%; border-radius: 50%; background: #4A5A47"></div><div style="position: absolute; right: 10%; top: 14%; width: 20%; height: 50%; border-radius: 40%; background: #34413A"></div></div><button aria-label="Убрать картинку" style="position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; border: none; border-radius: 14px; background: rgba(21,20,18,0.7); color: #ECE6DD; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
<div style="display: flex; gap: 8px; margin-left: 54px"><button style="height: 36px; padding: 0 12px; border: 1px solid #3A3631; border-radius: 12px; background: transparent; color: #ECE6DD; font-weight: 600; font-family: inherit; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="m21 17-5-5-8 8"></path></svg>Фото</button><button style="height: 36px; padding: 0 12px; border: 1px solid #3A3631; border-radius: 12px; background: transparent; color: #ECE6DD; font-weight: 600; font-family: inherit; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h12V7z"></path><path d="M14 3v4h4"></path></svg>Файл</button><span style="margin-left: auto; align-self: center; font-size: 12px; color: #8A8276">Картинка сожмётся до 1,2 МБ перед отправкой</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #8A8276">ГДЕ ВИДНО</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{where}}" as="w" hint-placeholder-count="3"><button onClick="{{w.flip}}" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid {{w.border}}; background: {{w.bg}}; color: {{w.color}}; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer"><span style="width: 16px; height: 16px; border-radius: 4px; border: 2px solid {{w.border}}; background: {{w.fill}}; box-sizing: border-box"></span>{{w.name}}</button></sc-for>
</div><span style="font-size: 12px; color: #8A8276">«Кооператив по средам» отключил стены — туда пост не уйдёт.</span></div>
</div>
<div style="padding: 14px 24px 20px; border-top: 1px solid #2D2A26; display: flex; align-items: center; justify-content: space-between"><span style="font-size: 12px; color: #8A8276">Подписан ключом A0D2·5F11 · только реакции, без комментариев</span><a href="Main.dc.html" style="height: 42px; padding: 0 18px; border-radius: 12px; background: {{accent}}; color: #1C1B19; text-decoration: none; display: flex; align-items: center; font-size: 14px; font-weight: 700">Опубликовать</a></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#C9A06B", "options": ["#C9A06B", "#D97A4A", "#5FA8A0"]}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  state = { w: { np: true, ms: true, ks: false } };
  renderVals() {
    const accent = this.props.accent ?? '#C9A06B';
    const W = [['np', 'Ночной привал', false], ['ms', 'Мастерская', false], ['ks', 'Кооператив по средам', true]];
    return {
      accent,
      where: W.map(([id, name, off]) => { const on = !off && this.state.w[id]; return { name, border: off ? '#2D2A26' : (on ? accent : '#3A3631'), bg: on ? '#2A251F' : 'transparent', color: off ? '#5E5850' : '#ECE6DD', fill: on ? accent : 'transparent', flip: () => { if (!off) this.setState({ w: { ...this.state.w, [id]: !this.state.w[id] } }); } }; })
    };
  }
}
</script>
</body>
</html>
