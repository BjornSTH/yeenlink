<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Светлая тема — YeenLink — настройки, Android</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F4F0EA; color: #2A2622; font-family: 'Manrope', system-ui, sans-serif; overflow: hidden">
<sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">
<header style="height: 60px; flex-shrink: 0; padding: 0 20px; display: flex; align-items: center"><h1 style="margin: 0; font-size: 24px; font-weight: 800">Настройки</h1></header>
<div style="flex-grow: 1; overflow-y: auto; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 22px">
<button onClick="{{go.profile}}" style="padding: 14px; border: none; border-radius: 14px; background: #FBF8F3; color: #2A2622; display: flex; align-items: center; gap: 12px; text-align: left; font-family: inherit; cursor: pointer">
<div style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 26px; background: #7D6A7A; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; color: #1C1B19">ПЯ</div>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 17px; font-weight: 800">Пятнистый</span><span style="font-size: 12px; color: #6E655B; font-family: 'JetBrains Mono', monospace">пятнистый@nightcamp.ru</span></span>
<span style="color: #8A8276; display: flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></span>
</button>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="padding: 0 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #6E655B">АККАУНТ</span>
<div style="border-radius: 14px; background: #FBF8F3; display: flex; flex-direction: column; overflow: hidden">
<button onClick="{{go.security}}" style="height: 54px; padding: 0 14px; border: none; border-bottom: 1px solid #E3DCD1; background: transparent; color: #2A2622; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer">
<span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: #E3DCD1; color: #6B6258; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"></path><path d="m9 12 2 2 4-4"></path></svg></span><span style="flex-grow: 1">Безопасность и устройства</span><span style="color: #8A8276; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></span></button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="padding: 0 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #6E655B">ПРИЛОЖЕНИЕ</span>
<div style="border-radius: 14px; background: #FBF8F3; display: flex; flex-direction: column; overflow: hidden">
<button onClick="{{go.appearance}}" style="height: 54px; padding: 0 14px; border: none; border-bottom: 1px solid #E3DCD1; background: transparent; color: #2A2622; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer">
<span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: #E3DCD1; color: #6B6258; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.4A4.6 4.6 0 0 0 21 9.8C21 6 17 3 12 3z"></path><circle cx="7.5" cy="11" r="1"></circle><circle cx="10.5" cy="7" r="1"></circle><circle cx="15.5" cy="7.5" r="1"></circle></svg></span><span style="flex-grow: 1">Внешний вид</span><span style="color: #8A8276; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></span></button><button onClick="{{go.voice}}" style="height: 54px; padding: 0 14px; border: none; border-bottom: 1px solid #E3DCD1; background: transparent; color: #2A2622; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer">
<span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: #E3DCD1; color: #6B6258; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></span><span style="flex-grow: 1">Голос и видео</span><span style="color: #8A8276; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></span></button><button onClick="{{go.notifications}}" style="height: 54px; padding: 0 14px; border: none; border-bottom: 1px solid #E3DCD1; background: transparent; color: #2A2622; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer">
<span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: #E3DCD1; color: #6B6258; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></span><span style="flex-grow: 1">Уведомления</span><span style="color: #8A8276; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></span></button><button onClick="{{go.language}}" style="height: 54px; padding: 0 14px; border: none; border-bottom: 1px solid #E3DCD1; background: transparent; color: #2A2622; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer">
<span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: #E3DCD1; color: #6B6258; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg></span><span style="flex-grow: 1">Язык</span><span style="color: #8A8276; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></span></button>
</div>
</div>
<button style="height: 50px; border: none; border-radius: 14px; background: #FBF8F3; color: #A34E3E; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"></path></svg>Выйти из профиля</button>
<span style="text-align: center; font-size: 12px; color: #8A8276">YeenLink 0.1 · Android</span>
</div>
</sc-if>
<sc-if value="{{isDetail}}" hint-placeholder-val="{{ false }}">
<header style="height: 56px; flex-shrink: 0; padding: 0 6px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #E3DCD1">
<button aria-label="Назад" onClick="{{back}}" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: transparent; color: #2A2622; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
<span style="font-size: 17px; font-weight: 700">{{title}}</span>
</header>
<div style="flex-grow: 1; overflow-y: auto; padding: 18px 16px 28px">
<dc-import name="SettingsSectionLight" framed="{{ false }}" section="{{section}}" accent="{{accent}}" hint-size="100%,700px"></dc-import>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#C9A06B", "options": ["#C9A06B", "#D97A4A", "#5FA8A0"]}, "screen": {"editor": "enum", "default": "list", "options": ["list", "profile", "appearance", "voice", "notifications", "security", "language"]}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  state = { screen: null };
  renderVals() {
    const accent = this.props.accent ?? '#C9A06B';
    const screen = this.state.screen ?? this.props.screen ?? 'list';
    const titles = {profile: 'Профиль', appearance: 'Внешний вид', voice: 'Голос и видео', notifications: 'Уведомления', security: 'Безопасность и устройства', keybinds: 'Горячие клавиши', language: 'Язык'};
    const go = {};
    Object.keys(titles).forEach((k) => { go[k] = () => this.setState({ screen: k }); });
    return {
      accent, go, isList: screen === 'list', isDetail: screen !== 'list',
      section: screen === 'list' ? 'profile' : screen, title: titles[screen] ?? '',
      back: () => this.setState({ screen: 'list' })
    };
  }
}
</script>
</body>
</html>
