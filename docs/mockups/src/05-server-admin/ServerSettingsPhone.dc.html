<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>YeenLink — настройки сервера, Android</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #1C1B19; color: #ECE6DD; font-family: 'Manrope', system-ui, sans-serif; overflow: hidden">
<sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">
<header style="height: 56px; flex-shrink: 0; padding: 0 6px; display: flex; align-items: center; gap: 4px"><a href="MobileApp.dc.html" aria-label="Назад" style="width: 44px; height: 44px; border-radius: 22px; color: #ECE6DD; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a><span style="font-size: 17px; font-weight: 700">Настройки сервера</span></header>
<div style="flex-grow: 1; overflow-y: auto; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 20px">
<div style="padding: 14px; border-radius: 14px; background: #24221F; display: flex; align-items: center; gap: 12px"><div style="width: 52px; height: 52px; border-radius: 15px; background: #3A3026; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">НП</div><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 800">Ночной привал</span><span style="font-size: 12px; color: #8BAA7A">Работает · 6 в сети</span></span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="padding: 0 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #8A8276">СЕРВЕР</span><div style="border-radius: 14px; background: #24221F; display: flex; flex-direction: column; overflow: hidden"><button onClick="{{go.overview}}" style="height: 54px; padding: 0 14px; border: none; border-bottom: 1px solid #2D2A26; background: transparent; color: #ECE6DD; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer"><span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: #2D2A26; color: #A39A8D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9H4z"></path></svg></span><span style="flex-grow: 1">Обзор</span><span style="color: #6E675E; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></span></button><button onClick="{{go.roles}}" style="height: 54px; padding: 0 14px; border: none; border-bottom: 1px solid #2D2A26; background: transparent; color: #ECE6DD; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer"><span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: #2D2A26; color: #A39A8D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7v5c0 4 3.5 7 8 9 4.5-2 8-5 8-9V7z"></path></svg></span><span style="flex-grow: 1">Роли и права</span><span style="color: #6E675E; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></span></button><button onClick="{{go.channels}}" style="height: 54px; padding: 0 14px; border: none; border-bottom: 1px solid #2D2A26; background: transparent; color: #ECE6DD; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer"><span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: #2D2A26; color: #A39A8D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14M4 15h14M10 3 8 21M16 3l-2 18"></path></svg></span><span style="flex-grow: 1">Каналы</span><span style="color: #6E675E; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></span></button><button onClick="{{go.bots}}" style="height: 54px; padding: 0 14px; border: none; border-bottom: none; background: transparent; color: #ECE6DD; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer"><span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: #2D2A26; color: #A39A8D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="14" height="11" rx="3"></rect><path d="M12 4v4M9 13h.01M15 13h.01M9 16h6"></path></svg></span><span style="flex-grow: 1">Боты и вебхуки</span><span style="color: #6E675E; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></span></button></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="padding: 0 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #8A8276">ЛЮДИ</span><div style="border-radius: 14px; background: #24221F; display: flex; flex-direction: column; overflow: hidden"><button onClick="{{go.members}}" style="height: 54px; padding: 0 14px; border: none; border-bottom: 1px solid #2D2A26; background: transparent; color: #ECE6DD; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer"><span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: #2D2A26; color: #A39A8D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"></path></svg></span><span style="flex-grow: 1">Участники</span><span style="color: #6E675E; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></span></button><button onClick="{{go.invites}}" style="height: 54px; padding: 0 14px; border: none; border-bottom: 1px solid #2D2A26; background: transparent; color: #ECE6DD; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer"><span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: #2D2A26; color: #A39A8D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></span><span style="flex-grow: 1">Приглашения</span><span style="color: #6E675E; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></span></button><button onClick="{{go.moderation}}" style="height: 54px; padding: 0 14px; border: none; border-bottom: none; background: transparent; color: #ECE6DD; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer"><span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: #2D2A26; color: #A39A8D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14 4 6 6M11 7l6 6M8 10l6 6M4 20l6-6M14 4l-6 6 6 6 6-6z"></path></svg></span><span style="flex-grow: 1">Модерация</span><span style="color: #6E675E; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></span></button></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="padding: 0 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #8A8276">ТЕХНИЧЕСКОЕ</span><div style="border-radius: 14px; background: #24221F; display: flex; flex-direction: column; overflow: hidden"><button onClick="{{go.limits}}" style="height: 54px; padding: 0 14px; border: none; border-bottom: 1px solid #2D2A26; background: transparent; color: #ECE6DD; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer"><span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: #2D2A26; color: #A39A8D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18a8 8 0 1 1 16 0"></path><path d="m12 18 4-6"></path></svg></span><span style="flex-grow: 1">Лимиты и ресурсы</span><span style="color: #6E675E; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></span></button><button onClick="{{go.network}}" style="height: 54px; padding: 0 14px; border: none; border-bottom: none; background: transparent; color: #ECE6DD; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer"><span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: #2D2A26; color: #A39A8D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"></circle><circle cx="5" cy="19" r="2"></circle><circle cx="19" cy="19" r="2"></circle><path d="M12 7v5M12 12l-6 5M12 12l6 5"></path></svg></span><span style="flex-grow: 1">Адреса и соединение</span><span style="color: #6E675E; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></span></button></div></div>
</div>
</sc-if>
<sc-if value="{{isDetail}}" hint-placeholder-val="{{ false }}">
<header style="height: 56px; flex-shrink: 0; padding: 0 6px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #2D2A26"><button aria-label="Назад" onClick="{{back}}" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: transparent; color: #ECE6DD; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button><span style="font-size: 17px; font-weight: 700">{{title}}</span></header>
<div style="flex-grow: 1; overflow-y: auto; padding: 18px 16px 28px">
<dc-import name="ServerSection" framed="{{ false }}" section="{{section}}" accent="{{accent}}" hint-size="100%,700px"></dc-import>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#C9A06B", "options": ["#C9A06B", "#D97A4A", "#5FA8A0"]}, "screen": {"editor": "enum", "default": "list", "options": ["list", "overview", "roles", "channels", "bots", "members", "invites", "moderation", "limits", "network"]}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  state = { screen: null };
  renderVals() {
    const accent = this.props.accent ?? '#C9A06B';
    const screen = this.state.screen ?? this.props.screen ?? 'list';
    const titles = {overview: 'Обзор', roles: 'Роли и права', channels: 'Каналы', bots: 'Боты и вебхуки', members: 'Участники', invites: 'Приглашения', moderation: 'Модерация', limits: 'Лимиты и ресурсы', network: 'Адреса и соединение'};
    const go = {};
    Object.keys(titles).forEach((k) => { go[k] = () => this.setState({ screen: k }); });
    return { accent, go, isList: screen === 'list', isDetail: screen !== 'list', section: screen === 'list' ? 'overview' : screen, title: titles[screen] ?? '', back: () => this.setState({ screen: 'list' }) };
  }
}
</script>
</body>
</html>
