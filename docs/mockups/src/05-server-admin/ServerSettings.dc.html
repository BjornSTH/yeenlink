<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>YeenLink — настройки сервера, ПК</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: 'Manrope', system-ui, sans-serif">
<dc-import name="Main" accent="{{accent}}" hint-size="1440px,900px"></dc-import>
<div style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(15,14,13,0.7); display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-label="Настройки сервера" style="width: 1060px; height: 760px; border-radius: 18px; background: #1C1B19; border: 1px solid #2D2A26; box-shadow: 0 30px 80px rgba(0,0,0,0.5); display: flex; overflow: hidden; color: #ECE6DD">
<nav aria-label="Разделы" style="width: 260px; flex-shrink: 0; background: #201E1C; padding: 18px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 6px"><div style="width: 40px; height: 40px; border-radius: 12px; background: #3A3026; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800">НП</div><span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Ночной привал</span><span style="font-size: 11px; color: #8A8276">Вы владелец</span></span></div>
<span style="padding: 12px 12px 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #8A8276">СЕРВЕР</span><button onClick="{{nav.overview.pick}}" style="height: 38px; padding: 0 12px; border: none; border-radius: 9px; background: {{nav.overview.bg}}; color: {{nav.overview.color}}; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9H4z"></path></svg>Обзор</button><button onClick="{{nav.roles.pick}}" style="height: 38px; padding: 0 12px; border: none; border-radius: 9px; background: {{nav.roles.bg}}; color: {{nav.roles.color}}; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7v5c0 4 3.5 7 8 9 4.5-2 8-5 8-9V7z"></path></svg>Роли и права</button><button onClick="{{nav.channels.pick}}" style="height: 38px; padding: 0 12px; border: none; border-radius: 9px; background: {{nav.channels.bg}}; color: {{nav.channels.color}}; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14M4 15h14M10 3 8 21M16 3l-2 18"></path></svg>Каналы</button><button onClick="{{nav.bots.pick}}" style="height: 38px; padding: 0 12px; border: none; border-radius: 9px; background: {{nav.bots.bg}}; color: {{nav.bots.color}}; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="14" height="11" rx="3"></rect><path d="M12 4v4M9 13h.01M15 13h.01M9 16h6"></path></svg>Боты и вебхуки</button><span style="padding: 12px 12px 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #8A8276">ЛЮДИ</span><button onClick="{{nav.members.pick}}" style="height: 38px; padding: 0 12px; border: none; border-radius: 9px; background: {{nav.members.bg}}; color: {{nav.members.color}}; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"></path></svg>Участники</button><button onClick="{{nav.invites.pick}}" style="height: 38px; padding: 0 12px; border: none; border-radius: 9px; background: {{nav.invites.bg}}; color: {{nav.invites.color}}; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>Приглашения</button><button onClick="{{nav.moderation.pick}}" style="height: 38px; padding: 0 12px; border: none; border-radius: 9px; background: {{nav.moderation.bg}}; color: {{nav.moderation.color}}; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14 4 6 6M11 7l6 6M8 10l6 6M4 20l6-6M14 4l-6 6 6 6 6-6z"></path></svg>Модерация</button><span style="padding: 12px 12px 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #8A8276">ТЕХНИЧЕСКОЕ</span><button onClick="{{nav.limits.pick}}" style="height: 38px; padding: 0 12px; border: none; border-radius: 9px; background: {{nav.limits.bg}}; color: {{nav.limits.color}}; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18a8 8 0 1 1 16 0"></path><path d="m12 18 4-6"></path></svg>Лимиты и ресурсы</button><button onClick="{{nav.network.pick}}" style="height: 38px; padding: 0 12px; border: none; border-radius: 9px; background: {{nav.network.bg}}; color: {{nav.network.color}}; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; text-align: left; font-family: inherit; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"></circle><circle cx="5" cy="19" r="2"></circle><circle cx="19" cy="19" r="2"></circle><path d="M12 7v5M12 12l-6 5M12 12l6 5"></path></svg>Адреса и соединение</button>
<div style="flex-grow: 1"></div>
<button style="height: 38px; padding: 0 12px; border: none; border-radius: 9px; background: transparent; color: #D98C7A; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>Опасная зона</button>
</nav>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<div style="height: 70px; flex-shrink: 0; padding: 0 20px 0 32px; display: flex; align-items: center; justify-content: space-between"><h2 style="margin: 0; font-size: 22px; font-weight: 800">{{title}}</h2><a href="Main.dc.html" aria-label="Закрыть" style="width: 36px; height: 36px; border-radius: 18px; border: 1px solid #3A3631; color: #A39A8D; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a></div>
<div style="flex-grow: 1; overflow-y: auto; padding: 0 32px 32px">
<dc-import name="ServerSection" framed="{{ false }}" section="{{section}}" accent="{{accent}}" hint-size="100%,640px"></dc-import>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#C9A06B", "options": ["#C9A06B", "#D97A4A", "#5FA8A0"]}, "section": {"editor": "enum", "default": "overview", "options": ["overview", "roles", "channels", "bots", "members", "invites", "moderation", "limits", "network"]}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  state = { section: null };
  renderVals() {
    const accent = this.props.accent ?? '#C9A06B';
    const section = this.state.section ?? this.props.section ?? 'overview';
    const titles = {overview: 'Обзор', roles: 'Роли и права', channels: 'Каналы', bots: 'Боты и вебхуки', members: 'Участники', invites: 'Приглашения', moderation: 'Модерация', limits: 'Лимиты и ресурсы', network: 'Адреса и соединение'};
    const nav = {};
    Object.keys(titles).forEach((k) => { nav[k] = { bg: k === section ? '#2D2A26' : 'transparent', color: k === section ? '#ECE6DD' : '#A39A8D', pick: () => this.setState({ section: k }) }; });
    return { accent, section, nav, title: titles[section] };
  }
}
</script>
</body>
</html>
