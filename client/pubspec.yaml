name: yeenlink
description: "YeenLink — клиент"
publish_to: none

version: 0.0.1+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cbor: ^6.5.1
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  file_selector: ^1.1.0
  image: ^4.10.1
  unorm_dart: ^0.3.2
  crypto: ^3.0.7
  path_provider: ^2.1.6
  path_drawing: ^1.0.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  path: ^1.9.1
  integration_test:
    sdk: flutter
  drift_dev: ^2.35.1
  build_runner: ^2.15.1

flutter:
  uses-material-design: false
  generate: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
